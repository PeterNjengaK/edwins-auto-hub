<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#171b1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Edwin's Manager" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/images/app-icon-192.png" />
    <title>Admin | Edwin's Auto Hub</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="stylesheet" href="/admin/management.css" />
    <script src="/vendor/lucide.js" defer></script>
    <script src="/shared.js" defer></script>
    <script src="/admin/management.js" defer></script>
    <script src="/admin/session.js" defer></script>
    <script src="/admin/admin.js" defer></script>
    <script src="/admin/install.js" defer></script>
  </head>
  <body class="admin-body">
    <header class="admin-header">
      <a href="/" class="brand"
        ><span class="brand-symbol">E<span>.</span></span
        ><span class="brand-wordmark">EDWIN'S<span>AUTO HUB</span></span></a
      ><span class="admin-header-label">DEALERSHIP MANAGER</span
      ><a href="/" class="text-link"
        >View website <i data-lucide="arrow-up-right"></i
      ></a>
    </header>
    <main id="admin-main">
      <div class="loading-state">
        <span class="spinner"></span>
        <p>Loading workspace...</p>
      </div>
    </main>
    <dialog
      id="management-dialog"
      class="dialog editor-dialog"
      aria-label="Manage dealership"
    >
      <div class="dialog-top">
        <span class="eyebrow">DEALERSHIP MANAGER</span
        ><button
          class="icon-button"
          data-manager-close
          aria-label="Close panel"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="management-content"></div>
    </dialog>
    <div
      id="connection-status"
      class="connection-status"
      role="status"
      hidden
    ></div>
    <dialog id="editor-dialog" class="dialog editor-dialog">
      <div class="dialog-top">
        <span class="eyebrow">INVENTORY</span
        ><button class="icon-button" data-close aria-label="Close editor">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="editor-content"></div>
    </dialog>
    <dialog id="confirm-dialog" class="dialog">
      <h2>Delete this vehicle?</h2>
      <p>
        The listing will be removed from the catalogue. Existing enquiries will
        be kept.
      </p>
      <div class="confirm-actions">
        <button class="button outline" id="cancel-delete">Cancel</button
        ><button class="button" id="confirm-delete">Delete vehicle</button>
      </div>
      <div class="form-status" id="delete-error" role="status"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
