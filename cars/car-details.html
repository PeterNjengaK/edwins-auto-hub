<!-- ✅ Updated cars/car-details.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Details | Edwin's Auto Hub</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="page-container">

    <!-- Header -->
    <header>
      <div class="logo">Edwin's Auto Hub</div>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="index.html">Cars for Sale</a></li>
          <li><a href="../about/">About</a></li>
          <li><a href="../contact/">Contact</a></li>
          <li><a href="../sell/">Sell Your Car</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Car Details -->
      <section class="car-details" id="carDetails">
        <p>Loading car details...</p>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Edwin's Auto Hub. All rights reserved.</p>
    </footer>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const carId = params.get("id");

    fetch(`http://localhost:5000/api/cars/${carId}`)
      .then(res => res.json())
      .then(car => {
        const section = document.getElementById("carDetails");
        section.innerHTML = `
          <div class="car-image">
            <img src="${car.image}" alt="${car.name}">
          </div>
          <div class="car-info">
            <h1>${car.name}</h1>
            <p class="price">Ksh ${car.price}</p>
            <p><strong>Year:</strong> ${car.year}</p>
            <p><strong>Condition:</strong> ${car.condition}</p>
            <p><strong>Mileage:</strong> ${car.mileage} KM</p>
            <p class="description">${car.description}</p>
            <a href="../contact/" class="cta-button">Contact Seller</a>
          </div>
        `;
      })
      .catch(err => {
        document.getElementById("carDetails").innerHTML = `
          <p>⚠️ Failed to load car details.</p>
        `;
        console.error(err);
      });
  </script>
</body>
</html>
