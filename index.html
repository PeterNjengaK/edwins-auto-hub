<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edwin's Auto Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">

    <!-- Header / Navigation -->
    <header>
      <div class="logo">Edwin's Auto Hub</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="cars/">Cars for Sale</a></li>
          <li><a href="about/">About</a></li>
          <li><a href="contact/">Contact</a></li>
          <li><a href="sell/">Sell Your Car</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Hero Section -->
      <section class="hero">
        <h1>Your Ride, Your Pride</h1>
        <p>Find your perfect car today</p>
        <a href="cars/" class="cta-button">Browse Cars</a>
      </section>

      <!-- Featured Cars (Placeholder) -->
      <section class="featured">
        <h2>Featured Cars</h2>
        <div class="car-list">
          <div class="car-card">
            <img src="images/sample-car1.jpg" alt="Toyota Vitz">
            <h3>Toyota Vitz 2020</h3>
            <p>Ksh 1,000,000</p>
          </div>
          <div class="car-card">
            <img src="images/sample-car2.jpg" alt="Mazda Demio">
            <h3>Mazda Demio 2019</h3>
            <p>Ksh 950,000</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Edwin's Auto Hub. All rights reserved.</p>
    </footer>

  </div>
  <script src="script.js"></script>
</body>
</html>
